name: Compile LaTeX to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'main.tex'
      - '*.tex'
      - 'flake.nix'
      - 'flake.lock'
      - '.gitignore'
      - '.github/workflows/compile-pdf.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.20.0

      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Create build directory
        run: mkdir -p _build

      - name: Compile LaTeX with pdflatex
        run: |
          nix-shell shell.nix --command "pdflatex \
            -interaction=nonstopmode \
            -output-directory=_build \
            main.tex"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pdf-output
          path: _build/main.pdf
          retention-days: 30

      - name: Commit and push PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp _build/main.pdf main.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add main.pdf
          git diff --cached --quiet || git commit -m "build: update PDF"
          git push

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: _build/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Releases (latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: _build/main.pdf
