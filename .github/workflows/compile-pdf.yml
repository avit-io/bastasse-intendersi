name: Compile LaTeX to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'main.tex'
      - '*.tex'
      - 'flake.nix'
      - 'flake.lock'
      - '.gitignore'
      - '.github/workflows/compile-pdf.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.20.0

      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Clean and compile LaTeX with latexmk
        run: |
          rm -rf _build
          mkdir -p _build
          nix develop --command latexmk -pdf -interaction=nonstopmode -output-directory=_build -jobname=bastasse_intendersi main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pdf-output
          path: _build/bastasse_intendersi.pdf
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: _build/bastasse_intendersi.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: _build/bastasse_intendersi.pdf
          tag_name: latest
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
